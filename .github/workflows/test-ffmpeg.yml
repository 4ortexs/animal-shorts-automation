name: Test FFmpeg

on:
  workflow_dispatch:

jobs:
  ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: |
          ffmpeg \
            -f lavfi \
            -i color=c=black:s=1080x1920:d=5 \
            -f lavfi \
            -i anullsrc=r=24000:cl=mono \
            -t 5 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            test-short.mp4

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: test-ffmpeg-video
          path: test-short.mp4
