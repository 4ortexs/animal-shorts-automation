name: Generate Animal Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Animal Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          API_KEY = os.environ["GEMINI_API_KEY"]

          URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent"

          topics_file = "data/used_topics.json"

          try:
              with open(topics_file, "r", encoding="utf-8") as f:
                  used_topics = json.load(f)
          except Exception:
              used_topics = []

          used_topics_text = "\n".join(
              f"- {topic}" for topic in used_topics
          )

          if not used_topics_text:
              used_topics_text = "No topics have been used yet."

          prompt = f"""
          You are the content engine for an educational YouTube Shorts
          channel about animals and wildlife.

          Choose ONE NEW animal fact for a 30-45 second YouTube Short.

          These topics have already been used:

          {used_topics_text}

          Do NOT choose any of these topics again.

          Also avoid choosing a topic that is essentially the same idea
          with a different title.

          Requirements:

          1. Choose an interesting and scientifically accurate animal fact.
          2. Fact-check the important claims before writing.
          3. Avoid myths, exaggerations and unsupported claims.
          4. Accuracy is more important than sensationalism.
          5. Write natural English suitable for TTS.
          6. Target approximately 35-45 seconds.
          7. Create exactly 5 visual scene descriptions.
          8. No background music.
          9. Do not invent statistics.
          10. If a fact is uncertain, choose another topic.

          Return ONLY valid JSON:

          {{
            "topic": "...",
            "title": "...",
            "fact_check": {{
              "status": "PASS",
              "notes": [
                "...",
                "..."
              ]
            }},
            "script": "...",
            "scenes": [
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "hashtags": [
              "#animals",
              "#science",
              "#nature",
              "#facts",
              "#wildlife"
            ]
          }}

          PASS means the claims are sufficiently supported and safe to publish.
          FAIL means there is a significant factual problem.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.4,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              URL,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": API_KEY
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode("utf-8"))

          text = result["candidates"][0]["content"]["parts"][0]["text"]

          output = json.loads(text)

          print("")
          print("========== ANIMAL SHORT ==========")
          print("")

          print("TOPIC:", output["topic"])
          print("TITLE:", output["title"])

          print("")
          print("FACT CHECK:", output["fact_check"]["status"])

          print("")
          print("FACT-CHECK NOTES:")

          for note in output["fact_check"]["notes"]:
              print("-", note)

          if output["fact_check"]["status"] != "PASS":
              raise SystemExit(
                  "FACT CHECK FAILED - VIDEO WILL NOT BE GENERATED."
              )

          new_topic = output["topic"].strip().lower()

          for old_topic in used_topics:
              if new_topic == old_topic.strip().lower():
                  raise SystemExit(
                      "DUPLICATE TOPIC DETECTED - VIDEO WILL NOT BE GENERATED."
                  )

          print("")
          print("SCRIPT:")
          print("")
          print(output["script"])

          print("")
          print("SCENES:")

          for i, scene in enumerate(output["scenes"], 1):
              print(f"{i}. {scene}")

          print("")
          print("HASHTAGS:")
          print(" ".join(output["hashtags"]))

          used_topics.append(output["topic"])

          with open(topics_file, "w", encoding="utf-8") as f:
              json.dump(
                  used_topics,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("Topic saved successfully.")
          print("")
          print("========== SUCCESS ==========")

      - name: Save topic history
        run: |
          git config user.name "animal-shorts-bot"
          git config user.email "animal-shorts-bot@users.noreply.github.com"
          git add data/used_topics.json
          git diff --cached --quiet || git commit -m "Update used animal topics"
          git push
