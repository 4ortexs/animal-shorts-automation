name: Generate Animal Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate and Fact-Check Animal Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          API_KEY = os.environ["GEMINI_API_KEY"]
          URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent"

          prompt = r"""
          You are the research and fact-checking engine for an educational YouTube Shorts
          channel about animals and wildlife.

          Your task:

          1. Choose ONE interesting animal fact suitable for a 30-45 second YouTube Short.
          2. Check the scientific accuracy of every important claim internally.
          3. Avoid myths, exaggerations, clickbait claims, and uncertain facts.
          4. If a commonly repeated fact is misleading or oversimplified, correct it.
          5. Write a short, engaging English narration.
          6. Create 5 visual scene descriptions.

          IMPORTANT:
          - Accuracy is more important than being sensational.
          - Do not claim something is "100% true" unless it is genuinely established.
          - Do not invent statistics.
          - Do not use unsupported scientific claims.
          - The narration should sound natural when read by TTS.
          - No background music.
          - Target length: approximately 35-45 seconds.

          Return ONLY valid JSON in exactly this structure:

          {
            "topic": "...",
            "title": "...",
            "fact_check": {
              "status": "PASS",
              "notes": [
                "...",
                "..."
              ]
            },
            "script": "...",
            "scenes": [
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "hashtags": [
              "#animals",
              "#science",
              "#nature",
              "#facts",
              "#wildlife"
            ]
          }

          The fact_check status must be:
          PASS = the claims are sufficiently supported and safe to publish.
          FAIL = there is a significant factual problem.

          If you cannot confidently produce an accurate fact, choose another animal fact.
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.4,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              URL,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": API_KEY
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode("utf-8"))

          text = result["candidates"][0]["content"]["parts"][0]["text"]

          output = json.loads(text)

          print("\n========== ANIMAL SHORT ==========\n")
          print("TOPIC:", output["topic"])
          print("TITLE:", output["title"])

          print("\nFACT CHECK:", output["fact_check"]["status"])

          print("\nFACT-CHECK NOTES:")
          for note in output["fact_check"]["notes"]:
              print("-", note)

          if output["fact_check"]["status"] != "PASS":
              raise SystemExit("FACT CHECK FAILED - VIDEO WILL NOT BE GENERATED.")

          print("\nSCRIPT:\n")
          print(output["script"])

          print("\nSCENES:\n")
          for i, scene in enumerate(output["scenes"], 1):
              print(f"{i}. {scene}")

          print("\nHASHTAGS:")
          print(" ".join(output["hashtags"]))

          print("\n========== SUCCESS ==========\n")
          PY
