name: Create Animal Short

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install "kokoro>=0.9.4" soundfile openai-whisper

      # ============================================================
      # 1. GEMINI + PIXABAY TOPIC SELECTION
      # ============================================================

      - name: Generate topic and find matching footage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import re
          import time
          import glob

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          PIXABAY_API_KEY = os.environ["PIXABAY_API_KEY"]

          GEMINI_URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.1-flash-lite:generateContent"
          )

          TOPICS_FILE = "data/used_topics.json"

          # --------------------------------------------------------
          # FOOTAGE-RICH ANIMALS
          # --------------------------------------------------------

          FOOTAGE_RICH_ANIMALS = [
              "frog",
              "dog",
              "cat",
              "lion",
              "tiger",
              "elephant",
              "giraffe",
              "zebra",
              "penguin",
              "dolphin",
              "shark",
              "octopus",
              "turtle",
              "crocodile",
              "snake",
              "eagle",
              "owl",
              "bear",
              "fox",
              "wolf",
              "deer",
              "horse",
              "rabbit",
              "monkey",
              "gorilla",
              "chimpanzee",
              "panda",
              "koala",
              "kangaroo",
              "seal",
              "whale",
              "butterfly",
              "bee",
              "spider",
              "crab",
              "flamingo",
              "parrot",
              "pelican",
              "swan",
              "duck",
              "goose"
          ]

          # --------------------------------------------------------
          # COMPETING ANIMALS
          # --------------------------------------------------------

          COMPETING_ANIMALS = {
              "bird",
              "birds",
              "eagle",
              "owl",
              "parrot",
              "flamingo",
              "pelican",
              "swan",
              "duck",
              "goose",
              "fish",
              "shark",
              "dolphin",
              "whale",
              "seal",
              "turtle",
              "snake",
              "crocodile",
              "frog",
              "mammal",
              "dog",
              "cat",
              "lion",
              "tiger",
              "elephant",
              "giraffe",
              "zebra",
              "bear",
              "fox",
              "wolf",
              "deer",
              "horse",
              "rabbit",
              "monkey",
              "gorilla",
              "chimpanzee",
              "panda",
              "koala",
              "kangaroo",
              "octopus",
              "crab",
              "butterfly",
              "bee",
              "spider"
          }

          # --------------------------------------------------------
          # LOAD USED TOPICS
          # --------------------------------------------------------

          try:
              with open(
                  TOPICS_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:
                  used_topics = json.load(f)

          except Exception:
              used_topics = []

          used_topics_text = "\n".join(
              "- " + str(topic)
              for topic in used_topics
          )

          if not used_topics_text:
              used_topics_text = "No topics have been used yet."

          # --------------------------------------------------------
          # FUNCTIONS
          # --------------------------------------------------------

          def normalize_words(text):
              return set(
                  re.findall(
                      r"[a-z]+",
                      text.lower()
                  )
              )

          def get_gemini_topic():
              prompt = f"""
          You are the content engine for an educational YouTube Shorts
          channel about animals and wildlife.

          Choose ONE completely new animal fact for a 35-45 second
          YouTube Short.

          Previously used topics:
          {used_topics_text}

          IMPORTANT:

          The primary visual animal MUST be exactly one of these
          footage-rich animals:

          {", ".join(FOOTAGE_RICH_ANIMALS)}

          Do NOT choose rare species or obscure animals.

          The video can still explain a special fact about the animal,
          but the visual animal must remain one of the animals above.

          For example:
          - You may make a video about a surprising frog adaptation.
          - You may make a video about how octopuses use their arms.
          - You may make a video about a strange shark ability.

          But do NOT choose an obscure frog species as the primary
          footage animal.

          Requirements:

          - Scientifically accurate.
          - Interesting and surprising.
          - No myths.
          - No unsupported claims.
          - Natural English.
          - Male TTS friendly.
          - Approximately 35-45 seconds.
          - One primary animal.
          - Strongly visual topic.
          - The same animal should appear throughout the video.
          - Exactly 5 visual search terms.
          - Every search term MUST contain the exact primary animal.
          - Search terms must describe real footage of that animal.
          - No generic searches such as:
            wildlife
            nature
            animals
            animal footage
            wild animals
          - No background music.
          - Do not invent statistics.

          Return ONLY valid JSON:

          {{
            "topic": "...",
            "animal": "...",
            "title": "...",
            "script": "...",
            "search_terms": [
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "hashtags": [
              "#animals",
              "#science",
              "#nature",
              "#facts",
              "#wildlife"
            ]
          }}
          """

              request_data = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.5,
                      "responseMimeType": "application/json"
                  }
              }

              req = urllib.request.Request(
                  GEMINI_URL,
                  data=json.dumps(
                      request_data
                  ).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "x-goog-api-key": GEMINI_API_KEY
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  req
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              text = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              data = json.loads(text)

              return data

          def find_pixabay_clips(data):

              animal = data["animal"].strip().lower()

              # Animal MUST be from our approved list.
              if animal not in FOOTAGE_RICH_ANIMALS:
                  print(
                      "REJECTED ANIMAL:",
                      animal
                  )
                  return []

              search_terms = data["search_terms"]

              if len(search_terms) != 5:
                  print(
                      "Wrong number of search terms."
                  )
                  return []

              # Verify every search term contains the animal.
              for term in search_terms:

                  if animal not in term.lower():

                      print(
                          "INVALID SEARCH TERM:",
                          term
                      )

                      return []

              selected_clips = []
              selected_ids = set()

              # ----------------------------------------------------
              # SEARCH EACH SCENE
              # ----------------------------------------------------

              for scene_index, search_term in enumerate(
                  search_terms,
                  1
              ):

                  print("")
                  print(
                      "================================================"
                  )
                  print(
                      "SCENE",
                      scene_index
                  )
                  print(
                      "SEARCH:",
                      search_term
                  )
                  print(
                      "================================================"
                  )

                  queries = [
                      search_term,
                      animal,
                      animal + " close up",
                      animal + " wild",
                  ]

                  scene_selected = None
                  scene_score = -1

                  for query_text in queries:

                      if scene_selected is not None:
                          break

                      query = urllib.parse.quote(
                          query_text
                      )

                      url = (
                          "https://pixabay.com/api/videos/"
                          f"?key={PIXABAY_API_KEY}"
                          f"&q={query}"
                          "&category=animals"
                          "&safesearch=true"
                          "&per_page=20"
                          "&order=popular"
                      )

                      try:

                          req = urllib.request.Request(
                              url,
                              headers={
                                  "User-Agent":
                                      "Mozilla/5.0"
                              }
                          )

                          with urllib.request.urlopen(
                              req
                          ) as response:

                              result = json.loads(
                                  response.read().decode(
                                      "utf-8"
                                  )
                              )

                      except Exception as e:

                          print(
                              "Pixabay request failed:",
                              e
                          )

                          continue

                      videos = result.get(
                          "hits",
                          []
                      )

                      target_words = normalize_words(
                          animal
                      )

                      query_words = normalize_words(
                          query_text
                      )

                      for video in videos:

                          video_id = video.get(
                              "id"
                          )

                          if not video_id:
                              continue

                          if video_id in selected_ids:
                              continue

                          tags = str(
                              video.get(
                                  "tags",
                                  ""
                              )
                          ).lower()

                          tag_words = normalize_words(
                              tags
                          )

                          # ------------------------------------------------
                          # STRICT TARGET CHECK
                          # ------------------------------------------------

                          if animal not in tag_words:

                              continue

                          # ------------------------------------------------
                          # REJECT CLEARLY COMPETING ANIMALS
                          # ------------------------------------------------

                          competing = (
                              COMPETING_ANIMALS
                              .intersection(
                                  tag_words
                              )
                          )

                          competing.discard(
                              animal
                          )

                          # If another obvious animal is tagged,
                          # reject the clip.
                          if competing:

                              print(
                                  "Rejected competing animal:",
                                  competing,
                                  "|",
                                  tags
                              )

                              continue

                          # ------------------------------------------------
                          # SCORE
                          # ------------------------------------------------

                          score = 0

                          # Exact target animal
                          score += 200

                          # Search term similarity
                          score += (
                              len(
                                  query_words
                                  .intersection(
                                      tag_words
                                  )
                              ) * 10
                          )

                          # Popularity
                          score += min(
                              int(
                                  video.get(
                                      "views",
                                      0
                                  )
                              ) // 10000,
                              20
                          )

                          # Duration preference
                          duration = float(
                              video.get(
                                  "duration",
                                  0
                              )
                          )

                          if duration >= 8:
                              score += 20

                          if score > scene_score:

                              scene_score = score
                              scene_selected = video

                      time.sleep(0.5)

                  if scene_selected is None:

                      print(
                          "NO TRUSTED CLIP FOUND FOR SCENE",
                          scene_index
                      )

                      continue

                  video_id = scene_selected["id"]

                  selected_ids.add(
                      video_id
                  )

                  print(
                      "SELECTED VIDEO ID:",
                      video_id
                  )

                  print(
                      "SELECTED TAGS:",
                      scene_selected.get(
                          "tags",
                          ""
                      )
                  )

                  print(
                      "SOURCE:",
                      scene_selected.get(
                          "pageURL",
                          ""
                      )
                  )

                  video_url = (
                      scene_selected
                      ["videos"]
                      ["medium"]
                      ["url"]
                  )

                  output_file = (
                      f"scene_{scene_index}.mp4"
                  )

                  download_req = urllib.request.Request(
                      video_url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0"
                      }
                  )

                  try:

                      with urllib.request.urlopen(
                          download_req
                      ) as response:

                          with open(
                              output_file,
                              "wb"
                          ) as f:

                              f.write(
                                  response.read()
                              )

                  except Exception as e:

                      print(
                          "Download failed:",
                          e
                      )

                      continue

                  selected_clips.append(
                      {
                          "scene": scene_index,
                          "id": video_id,
                          "tags": scene_selected.get(
                              "tags",
                              ""
                          ),
                          "pageURL": scene_selected.get(
                              "pageURL",
                              ""
                          ),
                          "file": output_file
                      }
                  )

                  print(
                      "Downloaded:",
                      output_file
                  )

              return selected_clips

          # --------------------------------------------------------
          # RETRY UP TO 3 TIMES
          # --------------------------------------------------------

          MAX_ATTEMPTS = 3

          final_data = None
          final_clips = None

          for attempt in range(
              1,
              MAX_ATTEMPTS + 1
          ):

              print("")
              print(
                  "################################################"
              )
              print(
                  "ATTEMPT",
                  attempt,
                  "OF",
                  MAX_ATTEMPTS
              )
              print(
                  "################################################"
              )

              # Remove old scene files.
              for filename in glob.glob(
                  "scene_*.mp4"
              ):

                  try:
                      os.remove(filename)
                  except:
                      pass

              try:

                  data = get_gemini_topic()

              except Exception as e:

                  print(
                      "Gemini failed:",
                      e
                  )

                  continue

              print("")
              print(
                  "TOPIC:",
                  data.get(
                      "topic",
                      ""
                  )
              )

              print(
                  "ANIMAL:",
                  data.get(
                      "animal",
                      ""
                  )
              )

              print(
                  "TITLE:",
                  data.get(
                      "title",
                      ""
                  )
              )

              print("")
              print(
                  "SCRIPT:"
              )

              print(
                  data.get(
                      "script",
                      ""
                  )
              )

              # ----------------------------------------------------
              # DUPLICATE CHECK
              # ----------------------------------------------------

              new_topic = str(
                  data.get(
                      "topic",
                      ""
                  )
              ).strip().lower()

              duplicate = False

              for old_topic in used_topics:

                  if (
                      new_topic
                      ==
                      str(
                          old_topic
                      ).strip().lower()
                  ):

                      duplicate = True
                      break

              if duplicate:

                  print(
                      "DUPLICATE TOPIC."
                  )

                  continue

              # ----------------------------------------------------
              # PIXABAY
              # ----------------------------------------------------

              clips = find_pixabay_clips(
                  data
              )

              print("")
              print(
                  "FOUND TRUSTED CLIPS:",
                  len(clips)
              )

              # We need exactly five.
              if len(clips) != 5:

                  print(
                      "NOT ENOUGH TRUSTED CLIPS."
                  )

                  print(
                      "Trying another animal/topic..."
                  )

                  for filename in glob.glob(
                      "scene_*.mp4"
                  ):

                      try:
                          os.remove(filename)
                      except:
                          pass

                  continue

              # ----------------------------------------------------
              # SUCCESS
              # ----------------------------------------------------

              final_data = data
              final_clips = clips

              break

          if final_data is None:

              raise SystemExit(
                  "FAILED: Could not find a topic with "
                  "five trustworthy matching Pixabay clips "
                  "after three attempts."
              )

          # --------------------------------------------------------
          # SAVE DATA
          # --------------------------------------------------------

          with open(
              "short_data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Save footage information.
          with open(
              "footage_sources.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final_clips,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # Only NOW mark the topic as used.
          used_topics.append(
              final_data["topic"]
          )

          with open(
              TOPICS_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  used_topics,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "================================================"
          )
          print(
              "FOOTAGE SELECTION SUCCESS"
          )
          print(
              "================================================"
          )

          print(
              "Animal:",
              final_data["animal"]
          )

          for clip in final_clips:

              print(
                  "Scene",
                  clip["scene"],
                  "| ID:",
                  clip["id"],
                  "| Tags:",
                  clip["tags"]
              )

          PY

      # ============================================================
      # 2. KOKORO MALE VOICE
      # ============================================================

      - name: Generate male voice
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          with open(
              "short_data.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          pipeline = KPipeline(
              lang_code="a"
          )

          generator = pipeline(
              data["script"],
              voice="am_adam",
              speed=1.0
          )

          parts = []

          for _, _, audio in generator:

              parts.append(audio)

          if not parts:

              raise SystemExit(
                  "Kokoro did not generate audio."
              )

          audio = np.concatenate(
              parts
          )

          sf.write(
              "voice.wav",
              audio,
              24000
          )

          print(
              "Male Kokoro voice created!"
          )

          PY

      # ============================================================
      # 3. NORMALIZE + COMBINE FOOTAGE
      # ============================================================

      - name: Normalize and combine footage
        run: |
          mkdir -p normalized

          for file in scene_*.mp4; do

            [ -e "$file" ] || continue

            name=$(basename "$file" .mp4)

            ffmpeg \
              -y \
              -i "$file" \
              -t 8 \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              "normalized/${name}.mp4"

          done

          python - <<'PY'
          import glob
          import os

          files = sorted(
              glob.glob(
                  "normalized/scene_*.mp4"
              )
          )

          if len(files) != 5:

              raise SystemExit(
                  "Expected exactly 5 normalized clips."
              )

          with open(
              "clips.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for filename in files:

                  f.write(
                      "file '"
                      + os.path.abspath(filename)
                      + "'\n"
                  )

          print(
              "Normalized clips:"
          )

          print(
              "\n".join(files)
          )

          PY

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i clips.txt \
            -c copy \
            combined.mp4

      # ============================================================
      # 4. WHISPER
      # ============================================================

      - name: Generate Whisper captions
        run: |
          mkdir -p captions

          whisper voice.wav \
            --model tiny.en \
            --output_format srt \
            --output_dir captions

          echo "========== WHISPER SRT =========="

          cat captions/voice.srt

      # ============================================================
      # 5. SRT TO ASS
      # ============================================================

      - name: Convert captions to ASS
        run: |
          python - <<'PY'
          import re

          def ass_time(timestamp):

              timestamp = timestamp.strip()

              hours, minutes, rest = timestamp.split(":")

              seconds, milliseconds = rest.split(",")

              centiseconds = int(
                  milliseconds
              ) // 10

              return (
                  str(int(hours))
                  + ":"
                  + str(int(minutes)).zfill(2)
                  + ":"
                  + str(int(seconds)).zfill(2)
                  + "."
                  + str(centiseconds).zfill(2)
              )

          with open(
              "captions/voice.srt",
              "r",
              encoding="utf-8"
          ) as f:

              srt_text = f.read()

          blocks = re.split(
              r"\n\s*\n",
              srt_text.strip()
          )

          ass_lines = []

          ass_lines.append(
              "[Script Info]"
          )

          ass_lines.append(
              "ScriptType: v4.00+"
          )

          ass_lines.append(
              "PlayResX: 1080"
          )

          ass_lines.append(
              "PlayResY: 1920"
          )

          ass_lines.append(
              "Collisions: Normal"
          )

          ass_lines.append("")

          ass_lines.append(
              "[V4+ Styles]"
          )

          ass_lines.append(
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding"
          )

          ass_lines.append(
              "Style: Default,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,-1,0,0,0,100,100,0,0,1,5,2,2,80,80,260,1"
          )

          ass_lines.append("")

          ass_lines.append(
              "[Events]"
          )

          ass_lines.append(
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          )

          for block in blocks:

              lines = block.splitlines()

              if len(lines) < 3:
                  continue

              timing = lines[1]

              if " --> " not in timing:
                  continue

              start, end = timing.split(
                  " --> "
              )

              caption = " ".join(
                  line.strip()
                  for line in lines[2:]
              )

              caption = caption.replace(
                  "{",
                  "("
              )

              caption = caption.replace(
                  "}",
                  ")"
              )

              dialogue = (
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + caption
              )

              ass_lines.append(
                  dialogue
              )

          ass_text = "\n".join(
              ass_lines
          ) + "\n"

          with open(
              "captions/voice.ass",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  ass_text
              )

          print(
              "========== ASS CAPTIONS =========="
          )

          print(
              ass_text
          )

          PY

      # ============================================================
      # 6. FINAL VIDEO
      # ============================================================

      - name: Create final vertical Short
        run: |
          ffmpeg \
            -y \
            -i combined.mp4 \
            -i voice.wav \
            -vf "ass=captions/voice.ass" \
            -map 0:v \
            -map 1:a \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -shortest \
            -movflags +faststart \
            animal-short.mp4

          echo ""
          echo "========== FINAL VIDEO =========="

          ls -lh animal-short.mp4

      # ============================================================
      # 7. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload final Short
        uses: actions/upload-artifact@v4
        with:
          name: animal-short
          path: |
            animal-short.mp4
            short_data.json
            footage_sources.json
            captions/voice.srt
            captions/voice.ass

      # ============================================================
      # 8. SAVE TOPIC HISTORY
      # ============================================================

      - name: Save topic history
        run: |
          git config user.name "animal-shorts-bot"

          git config user.email \
            "animal-shorts-bot@users.noreply.github.com"

          git add data/used_topics.json

          git diff --cached --quiet || \
            git commit \
            -m "Update used animal topics"

          git push
