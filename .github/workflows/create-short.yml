name: Create Animal Short

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install "kokoro>=0.9.4" soundfile openai-whisper

      - name: Generate script with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          API_KEY = os.environ["GEMINI_API_KEY"]

          URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent"

          topics_file = "data/used_topics.json"

          try:
              with open(topics_file, "r", encoding="utf-8") as f:
                  used_topics = json.load(f)
          except Exception:
              used_topics = []

          used_topics_text = "\n".join(
              f"- {topic}" for topic in used_topics
          )

          if not used_topics_text:
              used_topics_text = "No topics have been used yet."

          prompt = f"""
          You are the content engine for an educational YouTube Shorts
          channel about animals and wildlife.

          Choose ONE NEW animal fact for a 30-45 second YouTube Short.

          Previously used topics:
          {used_topics_text}

          Do NOT repeat any previous topic or essentially the same idea.

          Requirements:

          - Scientifically accurate.
          - Interesting and surprising.
          - No myths or unsupported claims.
          - Natural English suitable for male TTS narration.
          - Approximately 35-45 seconds.
          - Exactly 5 visual scene search terms.
          - Each search term must describe real animal footage
            that could reasonably be found on Pixabay.
          - No background music.
          - Do not invent statistics.

          Return ONLY valid JSON:

          {{
            "topic": "...",
            "title": "...",
            "script": "...",
            "search_terms": [
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "hashtags": [
              "#animals",
              "#science",
              "#nature",
              "#facts",
              "#wildlife"
            ]
          }}
          """

          data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.4,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              URL,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": API_KEY
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          text = result["candidates"][0]["content"]["parts"][0]["text"]

          output = json.loads(text)

          if len(output["search_terms"]) != 5:
              raise SystemExit(
                  "Gemini did not provide exactly 5 search terms."
              )

          new_topic = output["topic"].strip().lower()

          for old_topic in used_topics:
              if new_topic == old_topic.strip().lower():
                  raise SystemExit(
                      "DUPLICATE TOPIC DETECTED."
                  )

          with open("short_data.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          used_topics.append(output["topic"])

          with open(topics_file, "w", encoding="utf-8") as f:
              json.dump(
                  used_topics,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("========== GEMINI SUCCESS ==========")
          print("TOPIC:", output["topic"])
          print("TITLE:", output["title"])
          print("SCRIPT:", output["script"])
          print("SEARCH TERMS:")

          for term in output["search_terms"]:
              print("-", term)
          PY

      - name: Generate male voice
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          with open("short_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          pipeline = KPipeline(lang_code="a")

          generator = pipeline(
              data["script"],
              voice="am_adam",
              speed=1.0
          )

          parts = []

          for _, _, audio in generator:
              parts.append(audio)

          audio = np.concatenate(parts)

          sf.write(
              "voice.wav",
              audio,
              24000
          )

          print("Male Kokoro voice created!")
          PY

      - name: Download five Pixabay clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import time

          API_KEY = os.environ["PIXABAY_API_KEY"]

          with open("short_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          search_terms = data["search_terms"]

          for index, search_term in enumerate(search_terms, 1):

              print("")
              print("========== SCENE", index, "==========")
              print("SEARCH:", search_term)

              query = urllib.parse.quote(search_term)

              url = (
                  "https://pixabay.com/api/videos/"
                  f"?key={API_KEY}"
                  f"&q={query}"
                  "&category=animals"
                  "&safesearch=true"
                  "&per_page=5"
              )

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              videos = result.get("hits", [])

              if not videos:
                  print("No footage found. Skipping this scene.")
                  continue

              video_url = videos[0]["videos"]["medium"]["url"]

              print("VIDEO:", video_url)

              req = urllib.request.Request(
                  video_url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req) as response:
                  with open(
                      f"scene_{index}.mp4",
                      "wb"
                  ) as f:
                      f.write(response.read())

              print("Downloaded scene", index)

              time.sleep(1)

          print("")
          print("Downloaded files:")

          for i in range(1, 6):
              filename = f"scene_{i}.mp4"

              if os.path.exists(filename):
                  print(filename)
          PY

      - name: Create combined footage
        run: |
          python - <<'PY'
          import os

          files = []

          for i in range(1, 6):
              filename = f"scene_{i}.mp4"

              if os.path.exists(filename):
                  files.append(filename)

          if not files:
              raise SystemExit(
                  "No Pixabay clips were downloaded."
              )

          with open("clips.txt", "w") as f:
              for filename in files:
                  f.write(
                      f"file '{os.path.abspath(filename)}'\n"
                  )

          print("Clips to combine:")
          print("\n".join(files))
          PY

          ffmpeg \
            -f concat \
            -safe 0 \
            -i clips.txt \
            -c copy \
            combined.mp4

      - name: Generate captions
        run: |
          mkdir -p captions

          whisper voice.wav \
            --model tiny.en \
            --output_format srt \
            --output_dir captions

          echo "========== CAPTIONS =========="
          cat captions/voice.srt

      - name: Create final vertical Short
        run: |
          ffmpeg \
            -i combined.mp4 \
            -i voice.wav \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,subtitles=captions/voice.srt:force_style='FontName=DejaVu Sans,FontSize=24,Bold=1,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=4,Shadow=2,Alignment=2,MarginV=300'" \
            -map 0:v \
            -map 1:a \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -shortest \
            -movflags +faststart \
            animal-short.mp4

          echo ""
          echo "========== FINAL VIDEO =========="
          ls -lh animal-short.mp4

      - name: Upload final Short
        uses: actions/upload-artifact@v4
        with:
          name: animal-short
          path: |
            animal-short.mp4
            short_data.json
            captions/voice.srt

      - name: Save topic history
        run: |
          git config user.name "animal-shorts-bot"
          git config user.email "animal-shorts-bot@users.noreply.github.com"

          git add data/used_topics.json

          git diff --cached --quiet || \
            git commit -m "Update used animal topics"

          git push
