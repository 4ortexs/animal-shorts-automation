name: Create Animal Short

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install "kokoro>=0.9.4" soundfile openai-whisper

      # ============================================================
      # 1. GEMINI
      # ============================================================

      - name: Generate script with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          API_KEY = os.environ["GEMINI_API_KEY"]

          URL = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.1-flash-lite:generateContent"
          )

          topics_file = "data/used_topics.json"

          try:
              with open(topics_file, "r", encoding="utf-8") as f:
                  used_topics = json.load(f)
          except Exception:
              used_topics = []

          used_topics_text = "\n".join(
              "- " + str(topic)
              for topic in used_topics
          )

          if not used_topics_text:
              used_topics_text = "No topics have been used yet."

          prompt = f"""
          You are the content engine for an educational YouTube Shorts
          channel about animals and wildlife.

          Choose ONE NEW animal fact for a 35-45 second YouTube Short.

          Previously used topics:
          {used_topics_text}

          Do NOT repeat any previous topic or essentially the same idea.

          Requirements:

          - Scientifically accurate.
          - Interesting and surprising.
          - No myths or unsupported claims.
          - Natural English suitable for male TTS narration.
          - Approximately 35-45 seconds.
          - Identify ONE primary animal species or clearly defined animal.
          - Prefer recognizable animals with abundant stock footage.
          - Prefer animals likely to have real footage on Pixabay.
          - Avoid extremely obscure animals when possible.
          - Keep the whole video visually focused on the same animal.
          - Exactly 5 visual scene search terms.
          - Every search term MUST contain the primary animal name.
          - Search terms must describe real animal footage.
          - Do NOT use generic searches such as:
            "wildlife", "nature", "animal footage",
            "beautiful animals", or "wild animals".
          - No background music.
          - Do not invent statistics.

          Return ONLY valid JSON:

          {{
            "topic": "...",
            "animal": "...",
            "title": "...",
            "script": "...",
            "search_terms": [
              "...",
              "...",
              "...",
              "...",
              "..."
            ],
            "hashtags": [
              "#animals",
              "#science",
              "#nature",
              "#facts",
              "#wildlife"
            ]
          }}
          """

          request_data = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ],
              "generationConfig": {
                  "temperature": 0.4,
                  "responseMimeType": "application/json"
              }
          }

          req = urllib.request.Request(
              URL,
              data=json.dumps(request_data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": API_KEY
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          text = result["candidates"][0]["content"]["parts"][0]["text"]

          output = json.loads(text)

          if len(output["search_terms"]) != 5:
              raise SystemExit(
                  "Gemini did not provide exactly 5 search terms."
              )

          animal = output["animal"].strip().lower()

          if not animal:
              raise SystemExit(
                  "Gemini did not provide an animal."
              )

          for term in output["search_terms"]:
              if animal not in term.lower():
                  raise SystemExit(
                      "Search term does not contain the primary animal: "
                      + term
                  )

          new_topic = output["topic"].strip().lower()

          for old_topic in used_topics:
              if new_topic == str(old_topic).strip().lower():
                  raise SystemExit(
                      "DUPLICATE TOPIC DETECTED."
                  )

          with open(
              "short_data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          used_topics.append(output["topic"])

          with open(
              topics_file,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  used_topics,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("========== GEMINI SUCCESS ==========")
          print("TOPIC:", output["topic"])
          print("ANIMAL:", output["animal"])
          print("TITLE:", output["title"])
          print("")
          print("SCRIPT:")
          print(output["script"])
          print("")
          print("SEARCH TERMS:")

          for term in output["search_terms"]:
              print("-", term)

          PY

      # ============================================================
      # 2. KOKORO MALE VOICE
      # ============================================================

      - name: Generate male voice
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import soundfile as sf
          from kokoro import KPipeline

          with open(
              "short_data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          pipeline = KPipeline(
              lang_code="a"
          )

          generator = pipeline(
              data["script"],
              voice="am_adam",
              speed=1.0
          )

          parts = []

          for _, _, audio in generator:
              parts.append(audio)

          if not parts:
              raise SystemExit(
                  "Kokoro did not generate audio."
              )

          audio = np.concatenate(parts)

          sf.write(
              "voice.wav",
              audio,
              24000
          )

          print("Male Kokoro voice created!")

          PY

      # ============================================================
      # 3. PIXABAY
      # ============================================================

      - name: Download relevant Pixabay clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import time
          import re

          API_KEY = os.environ["PIXABAY_API_KEY"]

          with open(
              "short_data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          animal = data["animal"].strip().lower()
          search_terms = data["search_terms"]

          generic_words = {
              "animal",
              "animals",
              "wildlife",
              "nature",
              "bird",
              "birds",
              "fish",
              "mammal",
              "mammals",
              "reptile",
              "reptiles",
              "marine",
              "ocean",
              "sea"
          }

          animal_words = set(
              re.findall(
                  r"[a-z]+",
                  animal
              )
          )

          distinctive_words = (
              animal_words - generic_words
          )

          downloaded = 0

          for index, search_term in enumerate(
              search_terms,
              1
          ):

              print("")
              print(
                  "========== SCENE",
                  index,
                  "=========="
              )

              print(
                  "SEARCH:",
                  search_term
              )

              query = urllib.parse.quote(
                  search_term
              )

              url = (
                  "https://pixabay.com/api/videos/"
                  f"?key={API_KEY}"
                  f"&q={query}"
                  "&category=animals"
                  "&safesearch=true"
                  "&per_page=20"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  req
              ) as response:

                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              videos = result.get(
                  "hits",
                  []
              )

              selected = None
              best_score = -1

              search_words = set(
                  re.findall(
                      r"[a-z]+",
                      search_term.lower()
                  )
              )

              for video in videos:

                  tags = str(
                      video.get(
                          "tags",
                          ""
                      )
                  ).lower()

                  tag_words = set(
                      re.findall(
                          r"[a-z]+",
                          tags
                      )
                  )

                  normalized_tags = " ".join(
                      re.findall(
                          r"[a-z]+",
                          tags
                      )
                  )

                  normalized_animal = " ".join(
                      re.findall(
                          r"[a-z]+",
                          animal
                      )
                  )

                  score = 0

                  if normalized_animal in normalized_tags:
                      score += 200

                  matched_distinctive = (
                      distinctive_words.intersection(
                          tag_words
                      )
                  )

                  score += (
                      len(matched_distinctive)
                      * 100
                  )

                  score += len(
                      search_words.intersection(
                          tag_words
                      )
                  ) * 5

                  if score > best_score:
                      best_score = score
                      selected = video

              if selected is None:
                  print(
                      "No Pixabay results found."
                  )
                  continue

              selected_tags = str(
                  selected.get(
                      "tags",
                      ""
                  )
              ).lower()

              selected_tag_words = set(
                  re.findall(
                      r"[a-z]+",
                      selected_tags
                  )
              )

              if distinctive_words:

                  if not distinctive_words.intersection(
                      selected_tag_words
                  ):

                      print(
                          "Pixabay results were found, "
                          "but no confident animal match."
                      )

                      print(
                          "BEST TAGS:",
                          selected.get(
                              "tags",
                              ""
                          )
                      )

                      continue

              print(
                  "MATCHED TAGS:",
                  selected.get(
                      "tags",
                      ""
                  )
              )

              video_url = selected[
                  "videos"
              ][
                  "medium"
              ][
                  "url"
              ]

              print(
                  "VIDEO:",
                  video_url
              )

              download_req = urllib.request.Request(
                  video_url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(
                  download_req
              ) as response:

                  with open(
                      f"scene_{index}.mp4",
                      "wb"
                  ) as f:

                      f.write(
                          response.read()
                      )

              print(
                  "Downloaded scene",
                  index
              )

              downloaded += 1

              time.sleep(1)

          if downloaded < 3:

              raise SystemExit(
                  "Only "
                  + str(downloaded)
                  + " relevant Pixabay clips were found. "
                  "At least 3 are required."
              )

          print("")
          print(
              "========== DOWNLOADED SCENES =========="
          )

          for i in range(1, 6):

              filename = (
                  f"scene_{i}.mp4"
              )

              if os.path.exists(
                  filename
              ):

                  print(
                      filename
                  )

          PY

      # ============================================================
      # 4. NORMALIZE + COMBINE
      # ============================================================

      - name: Normalize and combine footage
        run: |
          mkdir -p normalized

          for file in scene_*.mp4; do

            [ -e "$file" ] || continue

            name=$(basename "$file" .mp4)

            ffmpeg \
              -y \
              -i "$file" \
              -t 8 \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              "normalized/${name}.mp4"

          done

          python - <<'PY'
          import glob
          import os

          files = sorted(
              glob.glob(
                  "normalized/scene_*.mp4"
              )
          )

          if not files:
              raise SystemExit(
                  "No normalized clips were created."
              )

          with open(
              "clips.txt",
              "w",
              encoding="utf-8"
          ) as f:

              for filename in files:

                  f.write(
                      "file '"
                      + os.path.abspath(filename)
                      + "'\n"
                  )

          print(
              "Normalized clips:"
          )

          print(
              "\n".join(files)
          )

          PY

          ffmpeg \
            -y \
            -f concat \
            -safe 0 \
            -i clips.txt \
            -c copy \
            combined.mp4

      # ============================================================
      # 5. WHISPER
      # ============================================================

      - name: Generate Whisper captions
        run: |
          mkdir -p captions

          whisper voice.wav \
            --model tiny.en \
            --output_format srt \
            --output_dir captions

          echo "========== WHISPER SRT =========="

          cat captions/voice.srt

      # ============================================================
      # 6. SRT TO ASS
      # ============================================================

      - name: Convert captions to ASS
        run: |
          python - <<'PY'
          import re

          def ass_time(timestamp):
              timestamp = timestamp.strip()

              hours, minutes, rest = timestamp.split(":")

              seconds, milliseconds = rest.split(",")

              centiseconds = int(milliseconds) // 10

              return (
                  str(int(hours))
                  + ":"
                  + str(int(minutes)).zfill(2)
                  + ":"
                  + str(int(seconds)).zfill(2)
                  + "."
                  + str(centiseconds).zfill(2)
              )

          with open(
              "captions/voice.srt",
              "r",
              encoding="utf-8"
          ) as f:

              srt_text = f.read()

          blocks = re.split(
              r"\n\s*\n",
              srt_text.strip()
          )

          ass_lines = []

          ass_lines.append(
              "[Script Info]"
          )

          ass_lines.append(
              "ScriptType: v4.00+"
          )

          ass_lines.append(
              "PlayResX: 1080"
          )

          ass_lines.append(
              "PlayResY: 1920"
          )

          ass_lines.append(
              "Collisions: Normal"
          )

          ass_lines.append(
              ""
          )

          ass_lines.append(
              "[V4+ Styles]"
          )

          ass_lines.append(
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding"
          )

          ass_lines.append(
              "Style: Default,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,-1,0,0,0,100,100,0,0,1,5,2,2,80,80,260,1"
          )

          ass_lines.append(
              ""
          )

          ass_lines.append(
              "[Events]"
          )

          ass_lines.append(
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          )

          for block in blocks:

              lines = block.splitlines()

              if len(lines) < 3:
                  continue

              timing = lines[1]

              if " --> " not in timing:
                  continue

              start, end = timing.split(
                  " --> "
              )

              caption = " ".join(
                  line.strip()
                  for line in lines[2:]
              )

              caption = caption.replace(
                  "{",
                  "("
              )

              caption = caption.replace(
                  "}",
                  ")"
              )

              dialogue = (
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + caption
              )

              ass_lines.append(
                  dialogue
              )

          ass_text = "\n".join(
              ass_lines
          ) + "\n"

